[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thai-legal-agentic-rag"
version = "0.1.0"
description = "A small two-agent Thai legal RAG demonstration"
requires-python = ">=3.11"
dependencies = ["httpx", "langgraph", "python-dotenv"]

[project.scripts]
legal-brief = "thai_legal_rag.main:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
markers = ["live: calls the configured BBL LLM endpoint"]

[tool.hatch.build.targets.wheel]
packages = ["src/thai_legal_rag"]

[tool.hatch.build.targets.wheel.force-include]
"knowledge_base.txt" = "thai_legal_rag/knowledge_base.txt"
